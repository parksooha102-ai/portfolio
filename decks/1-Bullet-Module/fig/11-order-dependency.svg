<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="760" viewBox="0 0 680 380" role="img">
<title>장착 순서에 따라 관통력 2회 vs 1회 차감</title>
<desc>관통 → 분열 순서: 부모 탄환에서 관통 −1, 분열이 Kill. 자식 탄환이 같은 적 A와 다시 충돌해 분열은 무시, 관통 −1. 합계 2회(버그). 분열 → 관통 순서: 부모에서 분열이 Kill해 관통은 실행되지 않음. 자식에서 분열은 무시, 관통 −1. 합계 1회(의도대로). 출처: 기술문서 §4.5.</desc>
<defs>
<marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
.h{font:500 14px Pretendard,'Noto Sans KR',sans-serif;fill:#2C2C2A}
.s{font:400 12px Pretendard,'Noto Sans KR',sans-serif;fill:#5F5E5A}
.t{font:400 14px Pretendard,'Noto Sans KR',sans-serif;fill:#2C2C2A}
.m{font:400 13px D2Coding,Consolas,monospace;fill:#2C2C2A}
.big{font:500 40px Pretendard,'Noto Sans KR',sans-serif}
.area{fill:none;stroke:#5F5E5A;stroke-width:1;stroke-dasharray:6 4}
.cls{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:1}
.hitc{fill:#FAECE7;stroke:#D85A30;stroke-width:1.5}
.hitn{fill:#E6F1FB;stroke:#185FA5;stroke-width:1.5}
.off{fill:none;stroke:#B4B2A9;stroke-width:1;stroke-dasharray:3 3}
</style>
</defs>
<rect width="680" height="380" fill="#FFFFFF"/>
<text class="h" x="30" y="34">관통 → 분열</text>
<text class="s" x="112" y="34">장착 순서</text>
<text class="h" x="350" y="34">분열 → 관통</text>
<text class="s" x="432" y="34">장착 순서 (지금 고정)</text>
<line x1="30" y1="46" x2="330" y2="46" stroke="#D85A30" stroke-width="2"/>
<line x1="350" y1="46" x2="650" y2="46" stroke="#185FA5" stroke-width="2"/>
<rect class="area" x="30" y="60" width="300" height="84" rx="10"/>
<text class="s" x="46" y="80">부모 탄환 · 적 A와 충돌</text>
<rect class="hitc" x="46" y="92" width="120" height="40" rx="4"/><text class="t" x="106" y="117" text-anchor="middle" style="fill:#712B13">관통 −1</text>
<line x1="168" y1="112" x2="190" y2="112" stroke="#5F5E5A" stroke-width="1.25" marker-end="url(#ag)"/>
<rect class="cls" x="194" y="92" width="120" height="40" rx="4"/><text class="m" x="254" y="117" text-anchor="middle">분열 → Kill()</text>
<rect class="area" x="30" y="160" width="300" height="84" rx="10"/>
<text class="s" x="46" y="180">자식 탄환 · 같은 적 A와 다시 충돌</text>
<rect class="cls" x="46" y="192" width="120" height="40" rx="4"/><text class="t" x="106" y="217" text-anchor="middle">분열: 무시</text>
<line x1="168" y1="212" x2="190" y2="212" stroke="#5F5E5A" stroke-width="1.25" marker-end="url(#ag)"/>
<rect class="hitc" x="194" y="192" width="120" height="40" rx="4"/><text class="t" x="254" y="217" text-anchor="middle" style="fill:#712B13">관통 −1</text>
<rect class="area" x="350" y="60" width="300" height="84" rx="10"/>
<text class="s" x="366" y="80">부모 탄환 · 적 A와 충돌</text>
<rect class="cls" x="366" y="92" width="120" height="40" rx="4"/><text class="m" x="426" y="117" text-anchor="middle">분열 → Kill()</text>
<line x1="488" y1="112" x2="510" y2="112" stroke="#B4B2A9" stroke-width="1.25" stroke-dasharray="3 3" marker-end="url(#ag)"/>
<rect class="off" x="514" y="92" width="120" height="40" rx="4"/><text class="t" x="574" y="117" text-anchor="middle" style="fill:#888780">관통 실행 안 됨</text>
<rect class="area" x="350" y="160" width="300" height="84" rx="10"/>
<text class="s" x="366" y="180">자식 탄환 · 같은 적 A와 다시 충돌</text>
<rect class="cls" x="366" y="192" width="120" height="40" rx="4"/><text class="t" x="426" y="217" text-anchor="middle">분열: 무시</text>
<line x1="488" y1="212" x2="510" y2="212" stroke="#5F5E5A" stroke-width="1.25" marker-end="url(#ag)"/>
<rect class="hitn" x="514" y="192" width="120" height="40" rx="4"/><text class="t" x="574" y="217" text-anchor="middle" style="fill:#0C447C">관통 −1</text>
<text class="s" x="30" y="282">적 하나에 관통력 차감</text>
<text class="big" x="30" y="330" fill="#D85A30">2회</text>
<text class="s" x="108" y="322">버그</text>
<text class="s" x="350" y="282">적 하나에 관통력 차감</text>
<text class="big" x="350" y="330" fill="#185FA5">1회</text>
<text class="s" x="428" y="322">의도대로</text>
<text class="s" x="30" y="362">63가지 조합을 손으로 시험하다 발견</text>
</svg>
