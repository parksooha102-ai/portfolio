<text class="m" x="67" y="350">ModuleInfo</text>
<text class="s" x="150" y="350">ScriptableObject · 수치만(사거리, 튕김 횟수 등) → 에디터에서 밸런싱</text>
<text class="s" x="340" y="398" text-anchor="middle" style="fill:#185FA5">모듈끼리는 선이 없음 — 서로 모름</text>
