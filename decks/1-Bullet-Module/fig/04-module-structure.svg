<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="840" viewBox="0 0 680 420" role="img">
<title>Bullet과 모듈 구조</title>
<desc>Bullet이 IBulletModule 목록을 차례로 호출. 모듈 6종(추적·반사·관통·분열·폭발·부메랑)이 IBulletModule을 구현하고, 수치는 ModuleInfo(ScriptableObject)에서 읽음. 모듈끼리는 선이 없음. 출처: 기술문서 §2.2.</desc>
<defs>
<marker id="an" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
.h{font:500 14px Pretendard,'Noto Sans KR',sans-serif;fill:#2C2C2A}
.s{font:400 12px Pretendard,'Noto Sans KR',sans-serif;fill:#5F5E5A}
.t{font:400 14px Pretendard,'Noto Sans KR',sans-serif;fill:#2C2C2A}
.m{font:400 12px D2Coding,Consolas,monospace;fill:#2C2C2A}
.mh{font:500 14px D2Coding,Consolas,monospace;fill:#2C2C2A}
.cls{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:1}
</style>
</defs>
<rect width="680" height="420" fill="#FFFFFF"/>
<rect class="cls" x="260" y="24" width="160" height="56" rx="4"/>
<text class="mh" x="340" y="47" text-anchor="middle">Bullet</text>
<text class="s" x="340" y="67" text-anchor="middle">목록을 차례로 호출</text>
<line x1="340" y1="82" x2="340" y2="114" stroke="#185FA5" stroke-width="2" marker-end="url(#an)"/>
<rect x="51" y="118" width="578" height="76" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.25"/>
<text class="mh" x="340" y="142" text-anchor="middle" style="fill:#0C447C">IBulletModule</text>
<text class="s" x="340" y="174" text-anchor="middle" style="fill:#0C447C">비행 OnUpdate  ·  충돌 OnHit…  ·  생존 CanSurvive…  ·  생명주기 ResetState · Clone</text>
<line x1="95" y1="234" x2="95" y2="198" stroke="#185FA5" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#an)"/>
<line x1="193" y1="234" x2="193" y2="198" stroke="#185FA5" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#an)"/>
