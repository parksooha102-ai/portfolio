<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="760" viewBox="0 0 680 380" role="img">
<title>전용 탄환 63클래스 vs 모듈 6개</title>
<desc>왼쪽: 효과 6종의 조합마다 전용 탄환 클래스를 만들면 63개(작은 상자 63개, 그중 하나가 HomingSplitBullet). 오른쪽: Bullet 하나에 모듈 6종(추적·반사·관통·분열·폭발·부메랑)를 끼움. 출처: 기술문서 §2.1.</desc>
