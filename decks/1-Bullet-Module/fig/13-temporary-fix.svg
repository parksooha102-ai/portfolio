<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="560" viewBox="0 0 680 280" role="img">
<title>임시 대응: 분열을 맨 앞에 고정</title>
<desc>시도(자식 hitSet에 부모가 맞힌 적 등록) → 부작용(분열을 일으킨 적이 데미지 0) → 되돌림(주석 처리) → 맨 앞 고정(SplitModule을 목록 맨 앞에). 대가: 프레임워크가 is SplitModule을 아는 코드 1곳, 원인 제거가 아니라 드러나지 않게 묶음. 출처: 기술문서 §4.6.</desc>
<defs>
<marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
.h{font:500 14px Pretendard,'Noto Sans KR',sans-serif;fill:#2C2C2A}
.s{font:400 12px Pretendard,'Noto Sans KR',sans-serif;fill:#5F5E5A}
.t{font:400 14px Pretendard,'Noto Sans KR',sans-serif;fill:#2C2C2A}
.m{font:400 12px D2Coding,Consolas,monospace;fill:#2C2C2A}
.cls{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:1}
</style>
</defs>
<rect width="680" height="280" fill="#FFFFFF"/>
<text class="s" x="47" y="34">관통 + 분열 이중 차감을 막으려고</text>
<rect class="cls" x="47" y="50" width="130" height="80" rx="4"/>
<text class="h" x="112" y="74" text-anchor="middle">① 시도</text>
<text class="s" x="112" y="98" text-anchor="middle">자식 hitSet에</text>
<text class="s" x="112" y="116" text-anchor="middle">부모가 맞힌 적 등록</text>
<line x1="179" y1="90" x2="195" y2="90" stroke="#5F5E5A" stroke-width="1.25" marker-end="url(#ag)"/>
<rect x="199" y="50" width="130" height="80" rx="4" fill="#FAECE7" stroke="#D85A30" stroke-width="1.25"/>
<text class="h" x="264" y="74" text-anchor="middle" style="fill:#712B13">② 부작용</text>
<text class="s" x="264" y="98" text-anchor="middle" style="fill:#993C1D">분열을 일으킨 적이</text>
<text class="s" x="264" y="116" text-anchor="middle" style="fill:#993C1D">데미지 0</text>
<line x1="331" y1="90" x2="347" y2="90" stroke="#5F5E5A" stroke-width="1.25" marker-end="url(#ag)"/>
<rect x="351" y="50" width="130" height="80" rx="4" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="4 3"/>
<text class="h" x="416" y="74" text-anchor="middle" style="fill:#5F5E5A">③ 되돌림</text>
<text class="s" x="416" y="98" text-anchor="middle">시도한 코드를</text>
<text class="s" x="416" y="116" text-anchor="middle">주석 처리</text>
<line x1="483" y1="90" x2="499" y2="90" stroke="#5F5E5A" stroke-width="1.25" marker-end="url(#ag)"/>
<rect x="503" y="50" width="130" height="80" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="2"/>
<text class="h" x="568" y="74" text-anchor="middle" style="fill:#0C447C">④ 맨 앞 고정</text>
<text class="m" x="568" y="98" text-anchor="middle" style="fill:#0C447C">SplitModule을</text>
<text class="s" x="568" y="116" text-anchor="middle" style="fill:#185FA5">목록 맨 앞에</text>
<rect x="47" y="158" width="586" height="84" rx="4" fill="none" stroke="#D85A30" stroke-width="1"/>
<text class="h" x="63" y="184">대가</text>
<text class="t" x="110" y="184">프레임워크가 <tspan class="m" style="fill:#712B13">is SplitModule</tspan>을 아는 코드 1곳</text>
<text class="s" x="110" y="210">원인을 없앤 것이 아니라, 드러나지 않는 순서로 묶어 둠</text>
<text class="s" x="110" y="230">기한 때문에 고른 임시 대응</text>
</svg>
