<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="600" viewBox="0 0 680 300" role="img">
<title>탄환 실행 흐름과 모듈이 끼어드는 세 지점</title>
<desc>물리 프레임마다 Bullet이 OnUpdate 호출(추적) → 레이캐스트로 이동·충돌 감지 → 충돌 시 OnHit 호출(분열) → CanSurvive 판정(관통). 하나라도 true면 생존해 계속 날고, 전부 false면 소멸. 출처: 기술문서 §3.2.</desc>
<defs>
<marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="an" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ac" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
.h{font:500 14px Pretendard,'Noto Sans KR',sans-serif;fill:#2C2C2A}
.s{font:400 12px Pretendard,'Noto Sans KR',sans-serif;fill:#5F5E5A}
.t{font:400 14px Pretendard,'Noto Sans KR',sans-serif;fill:#2C2C2A}
.m{font:500 13px D2Coding,Consolas,monospace;fill:#0C447C}
.cls{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:1}
.hook{fill:#E6F1FB;stroke:#185FA5;stroke-width:1.25}
.tag{fill:#FFFFFF;stroke:#185FA5;stroke-width:1;stroke-dasharray:3 2}
</style>
</defs>
<rect width="680" height="300" fill="#FFFFFF"/>
<text class="s" x="47" y="34">매 물리 프레임(FixedUpdate)마다</text>
<line x1="47" y1="44" x2="633" y2="44" stroke="#B4B2A9" stroke-width="1"/>
<rect class="hook" x="47" y="62" width="130" height="56" rx="4"/>
<text class="m" x="112" y="85" text-anchor="middle">OnUpdate()</text>
<text class="s" x="112" y="104" text-anchor="middle" style="fill:#185FA5">비행 중</text>
<line x1="179" y1="90" x2="195" y2="90" stroke="#5F5E5A" stroke-width="1.25" marker-end="url(#ag)"/>
<rect class="cls" x="199" y="62" width="130" height="56" rx="4"/>
<text class="t" x="264" y="85" text-anchor="middle">이동·충돌 감지</text>
<text class="s" x="264" y="104" text-anchor="middle">레이캐스트</text>
<line x1="331" y1="90" x2="347" y2="90" stroke="#5F5E5A" stroke-width="1.25" marker-end="url(#ag)"/>
<rect class="hook" x="351" y="62" width="130" height="56" rx="4"/>
<text class="m" x="416" y="85" text-anchor="middle">OnHit…()</text>
<text class="s" x="416" y="104" text-anchor="middle" style="fill:#185FA5">충돌 시, 모듈 순서대로</text>
<line x1="483" y1="90" x2="499" y2="90" stroke="#5F5E5A" stroke-width="1.25" marker-end="url(#ag)"/>
<rect class="hook" x="503" y="62" width="130" height="56" rx="4"/>
<text class="m" x="568" y="85" text-anchor="middle">CanSurvive…()</text>
<text class="s" x="568" y="104" text-anchor="middle" style="fill:#185FA5">생존 판정</text>
<rect class="tag" x="82" y="130" width="60" height="26" rx="13"/><text class="s" x="112" y="147" text-anchor="middle" style="fill:#185FA5">추적</text>
<rect class="tag" x="386" y="130" width="60" height="26" rx="13"/><text class="s" x="416" y="147" text-anchor="middle" style="fill:#185FA5">분열</text>
<rect class="tag" x="538" y="130" width="60" height="26" rx="13"/><text class="s" x="568" y="147" text-anchor="middle" style="fill:#185FA5">관통</text>
<path d="M568 158 L568 176 L385 176 L385 204" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#an)"/>
<line x1="600" y1="158" x2="600" y2="204" stroke="#D85A30" stroke-width="1.5" marker-end="url(#ac)"/>
<rect x="300" y="208" width="170" height="44" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text class="t" x="385" y="235" text-anchor="middle" style="fill:#0C447C">하나라도 true → 생존</text>
<rect x="480" y="208" width="153" height="44" rx="4" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
<text class="t" x="556" y="235" text-anchor="middle" style="fill:#712B13">전부 false → 소멸</text>
<text class="s" x="47" y="226">파란 칸 = 모듈이 끼어드는 지점(훅)</text>
</svg>
